help_title=Bantuan
help_text=Parameter yang tersedia:\n\n/add → Tambahkan semua drive ke pengecualian\n\n- Contoh: Defender.exe atau Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | dll.\n\n/add=PATH → Tambahkan pengecualian spesifik\n\n- Contoh 1: Defender.exe /add=C:\Program Files\MyProgram\n- Contoh 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Hapus semua pengecualian\n\n/remove=PATH → Hapus pengecualian spesifik\n\n- Contoh 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Contoh 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Ekspor semua pengecualian\n\n/import → Impor semua pengecualian\n\n/help /h /? → Tampilkan bantuan\n\nJuga mendukung:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- Pengembang: Andy System.