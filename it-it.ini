help_title=Aiuto
help_text=Parametri disponibili:\n\n/add → Aggiungi tutte le unità alle esclusioni\n\n- Esempio: Defender.exe o Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | ecc.\n\n/add=PERCORSO → Aggiungi un'esclusione specifica\n\n- Esempio 1: Defender.exe /add=C:\Program Files\MyProgram\n- Esempio 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Rimuovi tutte le esclusioni\n\n/remove=PERCORSO → Rimuovi un'esclusione specifica\n\n- Esempio 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Esempio 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Esporta tutte le esclusioni\n\n/import → Importa tutte le esclusioni\n\n/help /h /? → Mostra aiuto\n\nSupporta anche:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=percorso | -r | -r=percorso | -e | -i | -help | -h | -?\n\n- Sviluppatore: Andy System.