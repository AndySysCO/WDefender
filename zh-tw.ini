help_title=說明
help_text=可用參數：\n\n/add → 將所有磁碟機新增至排除項目\n\n- 範例：Defender.exe 或 Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | 等\n\n/add=路徑 → 新增特定排除項目\n\n- 範例 1：Defender.exe /add=C:\Program Files\MyProgram\n- 範例 2：Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → 移除所有排除項目\n\n/remove=路徑 → 移除特定排除項目\n\n- 範例 1：Defender.exe /remove=C:\Program Files\MyProgram\n- 範例 2：Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → 匯出所有排除項目\n\n/import → 匯入所有排除項目\n\n/help /h /? → 顯示說明\n\n還支援：\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=路徑 | -r | -r=路徑 | -e | -i | -help | -h | -?\n\n- 開發人員：Andy System.