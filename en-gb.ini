help_title=Help
help_text=Available parameters:\n\n/add → Add all drives to exclusions\n\n- Example: Defender.exe or Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | etc.\n\n/add=PATH → Add a specific exclusion\n\n- Example 1: Defender.exe /add=C:\Program Files\MyProgram\n- Example 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Remove all exclusions\n\n/remove=PATH → Remove a specific exclusion\n\n- Example 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Example 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Export all exclusions\n\n/import → Import all exclusions\n\n/help /h /? → Show help\n\nAlso supports:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- Developer: Andy System.