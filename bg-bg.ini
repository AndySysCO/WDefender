help_title=Помощ
help_text=Налични параметри:\n\n/add → Добавяне на всички устройства към изключенията\n\n- Пример: Defender.exe или Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | и т.н.\n\n/add=ПЪТ → Добавяне на специфично изключение\n\n- Пример 1: Defender.exe /add=C:\Program Files\MiPrograma\n- Пример 2: Defender.exe /add=%ProgramFiles%\MiPrograma\n\n/remove → Премахване на всички изключения\n\n/remove=ПЪТ → Премахване на специфично изключение\n\n- Пример 1: Defender.exe /remove=C:\Program Files\MiPrograma\n- Пример 2: Defender.exe /remove=%ProgramFiles%\MiPrograma\n\n/export → Експортиране на всички изключения\n\n/import → Импортиране на всички изключения\n\n/help /h /? → Показване на помощ\n\nСъщо така поддържа:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=път | -r | -r=път | -e | -i | -help | -h | -?\n\n- Разработчик: Andy System.