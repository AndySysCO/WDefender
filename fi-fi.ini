help_title=Ohje
help_text=Käytettävissä olevat parametrit:\n\n/add → Lisää kaikki asemat poissulkemisiin\n\n- Esimerkki: Defender.exe tai Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | jne.\n\n/add=POLKU → Lisää tietty poissulkeminen\n\n- Esimerkki 1: Defender.exe /add=C:\Program Files\MyProgram\n- Esimerkki 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Poista kaikki poissulkemiset\n\n/remove=POLKU → Poista tietty poissulkeminen\n\n- Esimerkki 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Esimerkki 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Vie kaikki poissulkemiset\n\n/import → Tuo kaikki poissulkemiset\n\n/help /h /? → Näytä ohje\n\nTuetut muodot myös:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=polku | -r | -r=polku | -e | -i | -help | -h | -?\n\n- Kehittäjä: Andy System.