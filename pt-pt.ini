help_title=Ajuda
help_text=Parâmetros disponíveis:\n\n/add → Adicionar todas as unidades às exclusões\n\n- Exemplo: Defender.exe ou Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | etc.\n\n/add=CAMINHO → Adicionar uma exclusão específica\n\n- Exemplo 1: Defender.exe /add=C:\Program Files\MyProgram\n- Exemplo 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Remover todas as exclusões\n\n/remove=CAMINHO → Remover uma exclusão específica\n\n- Exemplo 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Exemplo 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportar todas as exclusões\n\n/import → Importar todas as exclusões\n\n/help /h /? → Mostrar ajuda\n\nTambém suporta:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=caminho | -r | -r=caminho | -e | -i | -help | -h | -?\n\n- Desenvolvedor: Andy System.