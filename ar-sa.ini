help_title=مساعدة
help_text=المعلمات المتاحة:\n\n/add ← إضافة جميع الأقراص إلى الاستثناءات\n\n- مثال: Defender.exe أو Defender.lnk /add ← C:\ | D:\ | E:\ | J:\ | إلخ.\n\n/add=PATH ← إضافة استثناء محدد\n\n- مثال 1: Defender.exe /add=C:\Program Files\MiPrograma\n- مثال 2: Defender.exe /add=%ProgramFiles%\MiPrograma\n\n/remove ← إزالة جميع الاستثناءات\n\n/remove=PATH ← إزالة استثناء محدد\n\n- مثال 1: Defender.exe /remove=C:\Program Files\MiPrograma\n- مثال 2: Defender.exe /remove=%ProgramFiles%\MiPrograma\n\n/export ← تصدير جميع الاستثناءات\n\n/import ← استيراد جميع الاستثناءات\n\n/help /h /? ← عرض المساعدة\n\nيدعم أيضًا:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- المطور: Andy System.