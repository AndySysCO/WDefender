help_title=Aide
help_text=Paramètres disponibles :\n\n/add → Ajouter tous les lecteurs aux exclusions\n\n- Exemple : Defender.exe ou Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | etc.\n\n/add=CHEMIN → Ajouter une exclusion spécifique\n\n- Exemple 1 : Defender.exe /add=C:\Program Files\MyProgram\n- Exemple 2 : Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Supprimer toutes les exclusions\n\n/remove=CHEMIN → Supprimer une exclusion spécifique\n\n- Exemple 1 : Defender.exe /remove=C:\Program Files\MyProgram\n- Exemple 2 : Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exporter toutes les exclusions\n\n/import → Importer toutes les exclusions\n\n/help /h /? → Afficher l'aide\n\nPrend également en charge :\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=chemin | -r | -r=chemin | -e | -i | -help | -h | -?\n\n- Développeur : Andy System.