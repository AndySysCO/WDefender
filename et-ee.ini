help_title=Abi
help_text=Saadaval parameetrid:\n\n/add → Lisa kõik kettad välistustesse\n\n- Näide: Defender.exe või Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | jne.\n\n/add=TEE → Lisa konkreetne välistus\n\n- Näide 1: Defender.exe /add=C:\Program Files\MyProgram\n- Näide 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Eemalda kõik välistused\n\n/remove=TEE → Eemalda konkreetne välistus\n\n- Näide 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Näide 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Ekspordi kõik välistused\n\n/import → Impordi kõik välistused\n\n/help /h /? → Näita abi\n\nToetab ka:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=tee | -r | -r=tee | -e | -i | -help | -h | -?\n\n- Arendaja: Andy System.