help_title=Hjelp
help_text=Tilgjengelige parametere:\n\n/add → Legg til alle stasjoner i unntak\n\n- Eksempel: Defender.exe eller Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | osv.\n\n/add=STI → Legg til et spesifikt unntak\n\n- Eksempel 1: Defender.exe /add=C:\Program Files\MyProgram\n- Eksempel 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Fjern alle unntak\n\n/remove=STI → Fjern et spesifikt unntak\n\n- Eksempel 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Eksempel 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksporter alle unntak\n\n/import → Importer alle unntak\n\n/help /h /? → Vis hjelp\n\nStøtter også:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=sti | -r | -r=sti | -e | -i | -help | -h | -?\n\n- Utvikler: Andy System.