help_title=Ajutor
help_text=Parametri disponibili:\n\n/add → Adaugă toate unitățile la excluderi\n\n- Exemplu: Defender.exe sau Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | etc.\n\n/add=CALE → Adaugă o excludere specifică\n\n- Exemplu 1: Defender.exe /add=C:\Program Files\MyProgram\n- Exemplu 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Elimină toate excluderile\n\n/remove=CALE → Elimină o excludere specifică\n\n- Exemplu 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Exemplu 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportă toate excluderile\n\n/import → Importă toate excluderile\n\n/help /h /? → Afișează ajutor\n\nSuportă de asemenea:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=cale | -r | -r=cale | -e | -i | -help | -h | -?\n\n- Dezvoltator: Andy System.
