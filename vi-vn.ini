help_title=Trợ giúp
help_text=Các tham số khả dụng:\n\n/add → Thêm tất cả các ổ đĩa vào danh sách loại trừ\n\n- Ví dụ: Defender.exe hoặc Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | v.v.\n\n/add=ĐƯỜNG_DẪN → Thêm một loại trừ cụ thể\n\n- Ví dụ 1: Defender.exe /add=C:\Program Files\MyProgram\n- Ví dụ 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Xóa tất cả các loại trừ\n\n/remove=ĐƯỜNG_DẪN → Xóa một loại trừ cụ thể\n\n- Ví dụ 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Ví dụ 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Xuất tất cả các loại trừ\n\n/import → Nhập tất cả các loại trừ\n\n/help /h /? → Hiển thị trợ giúp\n\nCũng hỗ trợ:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=đường_dẫn | -r | -r=đường_dẫn | -e | -i | -help | -h | -?\n\n- Nhà phát triển: Andy System.
