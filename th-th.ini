help_title=ความช่วยเหลือ
help_text=พารามิเตอร์ที่ใช้งานได้:\n\n/add → เพิ่มไดรฟ์ทั้งหมดไปยังรายการยกเว้น\n\n- ตัวอย่าง: Defender.exe หรือ Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | และอื่นๆ\n\n/add=PATH → เพิ่มการยกเว้นเฉพาะเจาะจง\n\n- ตัวอย่าง 1: Defender.exe /add=C:\Program Files\MyProgram\n- ตัวอย่าง 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → ลบรายการยกเว้นทั้งหมด\n\n/remove=PATH → ลบการยกเว้นเฉพาะเจาะจง\n\n- ตัวอย่าง 1: Defender.exe /remove=C:\Program Files\MyProgram\n- ตัวอย่าง 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → ส่งออกรายการยกเว้นทั้งหมด\n\n/import → นำเข้ารายการยกเว้นทั้งหมด\n\n/help /h /? → แสดงความช่วยเหลือ\n\nรองรับเช่นกัน:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- ผู้พัฒนา: Andy System.