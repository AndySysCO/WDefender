help_title=Hilfe
help_text=Verfügbare Parameter:\n\n/add → Alle Laufwerke zu den Ausschlüssen hinzufügen\n\n- Beispiel: Defender.exe oder Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | usw.\n\n/add=PFAD → Einen spezifischen Ausschluss hinzufügen\n\n- Beispiel 1: Defender.exe /add=C:\Program Files\MyProgram\n- Beispiel 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Alle Ausschlüsse entfernen\n\n/remove=PFAD → Einen spezifischen Ausschluss entfernen\n\n- Beispiel 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Beispiel 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Alle Ausschlüsse exportieren\n\n/import → Alle Ausschlüsse importieren\n\n/help /h /? → Hilfe anzeigen\n\nUnterstützt auch:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=pfad | -r | -r=pfad | -e | -i | -help | -h | -?\n\n- Entwickler: Andy System.
