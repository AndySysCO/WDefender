help_title=Ярдәм
help_text=Мөмкин булган параметрлар:\n\n/add → Барлык дискларны чыгармаларга өстәү\n\n- Мисал: Defender.exe яки Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | һ.б.\n\n/add=ЮЛ → Конкрет чыгарма өстәү\n\n- Мисал 1: Defender.exe /add=C:\Program Files\MyProgram\n- Мисал 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Барлык чыгармаларны бетерү\n\n/remove=ЮЛ → Конкрет чыгарманы бетерү\n\n- Мисал 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Мисал 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Барлык чыгармаларны экспортлау\n\n/import → Барлык чыгармаларны импортлау\n\n/help /h /? → Ярдәмне күрсәтү\n\nШулай ук түбәндәгеләрне хуплый:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=юл | -r | -r=юл | -e | -i | -help | -h | -?\n\n- Эшләүче: Andy System.
