help_title=सहायता
help_text=उपलब्ध पैरामीटर:\n\n/add → सभी ड्राइव को बहिष्करण में जोड़ें\n\n- उदाहरण: Defender.exe या Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | आदि।\n\n/add=PATH → एक विशिष्ट बहिष्करण जोड़ें\n\n- उदाहरण 1: Defender.exe /add=C:\Program Files\MyProgram\n- उदाहरण 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → सभी बहिष्करण हटाएँ\n\n/remove=PATH → एक विशिष्ट बहिष्करण हटाएँ\n\n- उदाहरण 1: Defender.exe /remove=C:\Program Files\MyProgram\n- उदाहरण 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → सभी बहिष्करण निर्यात करें\n\n/import → सभी बहिष्करण आयात करें\n\n/help /h /? → सहायता दिखाएँ\n\nयह भी समर्थित है:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- डेवलपर: Andy System.