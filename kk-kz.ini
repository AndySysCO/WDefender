help_title=Көмек
help_text=Қолжетімді параметрлер:\n\n/add → Барлық дискілерді алып тастау тізіміне қосу\n\n- Мысал: Defender.exe немесе Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | т.б.\n\n/add=ЖОЛ → Нақты алып тастауды қосу\n\n- Мысал 1: Defender.exe /add=C:\Program Files\MyProgram\n- Мысал 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Барлық алып тастауларды жою\n\n/remove=ЖОЛ → Нақты алып тастауды жою\n\n- Мысал 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Мысал 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Барлық алып тастауларды экспорттау\n\n/import → Барлық алып тастауларды импорттау\n\n/help /h /? → Көмекті көрсету\n\nСондай-ақ қолдайды:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=жол | -r | -r=жол | -e | -i | -help | -h | -?\n\n- Әзірлеуші: Andy System.