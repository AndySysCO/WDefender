help_title=Pomoc
help_text=Dostupné parametre:\n\n/add → Pridať všetky jednotky do vylúčení\n\n- Príklad: Defender.exe alebo Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | atď.\n\n/add=CESTA → Pridať konkrétne vylúčenie\n\n- Príklad 1: Defender.exe /add=C:\Program Files\MyProgram\n- Príklad 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Odstrániť všetky vylúčenia\n\n/remove=CESTA → Odstrániť konkrétne vylúčenie\n\n- Príklad 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Príklad 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportovať všetky vylúčenia\n\n/import → Importovať všetky vylúčenia\n\n/help /h /? → Zobraziť pomoc\n\nTiež podporuje:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=cesta | -r | -r=cesta | -e | -i | -help | -h | -?\n\n- Vývojár: Andy System.