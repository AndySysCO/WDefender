help_title=Pagalba
help_text=Galimi parametrai:\n\n/add → Pridėti visus diskus į išimtis\n\n- Pavyzdys: Defender.exe arba Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | ir t. t.\n\n/add=KELIAS → Pridėti konkrečią išimtį\n\n- Pavyzdys 1: Defender.exe /add=C:\Program Files\MyProgram\n- Pavyzdys 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Pašalinti visas išimtis\n\n/remove=KELIAS → Pašalinti konkrečią išimtį\n\n- Pavyzdys 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Pavyzdys 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksportuoti visas išimtis\n\n/import → Importuoti visas išimtis\n\n/help /h /? → Rodyti pagalbą\n\nTaip pat palaiko:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=kelias | -r | -r=kelias | -e | -i | -help | -h | -?\n\n- Kūrėjas: Andy System.