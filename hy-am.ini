help_title=Օգնություն
help_text=Հասանելի պարամետրեր:\n\n/add → Ավելացնել բոլոր սկավառակները բացառությունների մեջ\n\n- Օրինակ: Defender.exe կամ Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | և այլն:\n\n/add=ՈՒՂԻ → Ավելացնել կոնկրետ բացառություն\n\n- Օրինակ 1: Defender.exe /add=C:\Program Files\MyProgram\n- Օրինակ 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Հեռացնել բոլոր բացառությունները\n\n/remove=ՈՒՂԻ → Հեռացնել կոնկրետ բացառություն\n\n- Օրինակ 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Օրինակ 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Արտահանել բոլոր բացառությունները\n\n/import → Ներմուծել բոլոր բացառությունները\n\n/help /h /? → Ցույց տալ օգնությունը\n\nՆաև աջակցում է:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=ուղի | -r | -r=ուղի | -e | -i | -help | -h | -?\n\n- Մշակող՝ Andy System.