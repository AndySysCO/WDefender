help_title=Yardım
help_text=Mevcut parametreler:\n\n/add → Tüm sürücüleri dışlamalara ekle\n\n- Örnek: Defender.exe veya Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | vb.\n\n/add=YOL → Belirli bir dışlama ekle\n\n- Örnek 1: Defender.exe /add=C:\Program Files\MyProgram\n- Örnek 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Tüm dışlamaları kaldır\n\n/remove=YOL → Belirli bir dışlamayı kaldır\n\n- Örnek 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Örnek 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Tüm dışlamaları dışa aktar\n\n/import → Tüm dışlamaları içe aktar\n\n/help /h /? → Yardımı göster\n\nAyrıca şunları destekler:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=yol | -r | -r=yol | -e | -i | -help | -h | -?\n\n- Geliştirici: Andy System.
