help_title=Βοήθεια
help_text=Διαθέσιμες παράμετροι:\n\n/add → Προσθήκη όλων των μονάδων δίσκου στις εξαιρέσεις\n\n- Παράδειγμα: Defender.exe ή Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | κ.λπ.\n\n/add=ΔΙΑΔΡΟΜΗ → Προσθήκη συγκεκριμένης εξαίρεσης\n\n- Παράδειγμα 1: Defender.exe /add=C:\Program Files\MyProgram\n- Παράδειγμα 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Κατάργηση όλων των εξαιρέσεων\n\n/remove=ΔΙΑΔΡΟΜΗ → Κατάργηση συγκεκριμένης εξαίρεσης\n\n- Παράδειγμα 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Παράδειγμα 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Εξαγωγή όλων των εξαιρέσεων\n\n/import → Εισαγωγή όλων των εξαιρέσεων\n\n/help /h /? → Εμφάνιση βοήθειας\n\nΥποστηρίζει επίσης:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=διαδρομή | -r | -r=διαδρομή | -e | -i | -help | -h | -?\n\n- Προγραμματιστής: Andy System.