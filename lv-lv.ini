help_title=Palīdzība
help_text=Pieejamie parametri:\n\n/add → Pievienot visus diskus izņēmumiem\n\n- Piemērs: Defender.exe vai Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | utt.\n\n/add=CEĻŠ → Pievienot konkrētu izņēmumu\n\n- Piemērs 1: Defender.exe /add=C:\Program Files\MyProgram\n- Piemērs 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Noņemt visus izņēmumus\n\n/remove=CEĻŠ → Noņemt konkrētu izņēmumu\n\n- Piemērs 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Piemērs 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksportēt visus izņēmumus\n\n/import → Importēt visus izņēmumus\n\n/help /h /? → Rādīt palīdzību\n\nAtbalsta arī:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=ceļš | -r | -r=ceļš | -e | -i | -help | -h | -?\n\n- Izstrādātājs: Andy System.
