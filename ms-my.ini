help_title=Bantuan
help_text=Parameter yang tersedia:\n\n/add → Tambah semua pemacu ke pengecualian\n\n- Contoh: Defender.exe atau Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | dll.\n\n/add=LALUAN → Tambah pengecualian khusus\n\n- Contoh 1: Defender.exe /add=C:\Program Files\MyProgram\n- Contoh 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Alih keluar semua pengecualian\n\n/remove=LALUAN → Alih keluar pengecualian khusus\n\n- Contoh 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Contoh 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksport semua pengecualian\n\n/import → Import semua pengecualian\n\n/help /h /? → Tunjukkan bantuan\n\nJuga menyokong:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=laluan | -r | -r=laluan | -e | -i | -help | -h | -?\n\n- Pembangun: Andy System.