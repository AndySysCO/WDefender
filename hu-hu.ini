help_title=Súgó
help_text=Elérhető paraméterek:\n\n/add → Összes meghajtó hozzáadása a kivételekhez\n\n- Példa: Defender.exe vagy Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | stb.\n\n/add=ÚTVONAL → Specifikus kivétel hozzáadása\n\n- 1. példa: Defender.exe /add=C:\Program Files\MyProgram\n- 2. példa: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Összes kivétel eltávolítása\n\n/remove=ÚTVONAL → Specifikus kivétel eltávolítása\n\n- 1. példa: Defender.exe /remove=C:\Program Files\MyProgram\n- 2. példa: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Összes kivétel exportálása\n\n/import → Összes kivétel importálása\n\n/help /h /? → Súgó megjelenítése\n\nTámogatja továbbá:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=útvonal | -r | -r=útvonal | -e | -i | -help | -h | -?\n\n- Fejlesztő: Andy System.