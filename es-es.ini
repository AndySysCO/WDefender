help_title=Ayuda
help_text=Parámetros disponibles:\n\n/add → Agregar todas las unidades a las exclusiones\n\n- Ejemplo: Defender.exe o Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | etc.\n\n/add=RUTA → Agregar una exclusión específica\n\n- Ejemplo 1: Defender.exe /add=C:\Program Files\MyProgram\n- Ejemplo 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Eliminar todas las exclusiones\n\n/remove=RUTA → Eliminar una exclusión específica\n\n- Ejemplo 1: Defender.exe /remove=C:\Program Files\MyProgram\n\n- Ejemplo 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportar todas las exclusiones\n\n/import → Importar todas las exclusiones\n\n/help /h /? → Mostrar ayuda\n\nTambién admite:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=ruta | -r | -r=ruta | -e | -i | -help | -h | -?\n\n- Desarrollador: Andy System.
