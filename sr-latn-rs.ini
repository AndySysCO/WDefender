help_title=Pomoć
help_text=Dostupni parametri:\n\n/add → Dodaj sve diskove u izuzetke\n\n- Primer: Defender.exe ili Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | itd.\n\n/add=PUTANJA → Dodaj specifičan izuzetak\n\n- Primer 1: Defender.exe /add=C:\Program Files\MyProgram\n- Primer 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Ukloni sve izuzetke\n\n/remove=PUTANJA → Ukloni specifičan izuzetak\n\n- Primer 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Primer 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Izvezi sve izuzetke\n\n/import → Uvezi sve izuzetke\n\n/help /h /? → Prikaži pomoć\n\nTakođe podržava:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=putanja | -r | -r=putanja | -e | -i | -help | -h | -?\n\n- Programer: Andy System.