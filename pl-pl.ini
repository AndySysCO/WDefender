help_title=Pomoc
help_text=Dostępne parametry:\n\n/add → Dodaj wszystkie dyski do wykluczeń\n\n- Przykład: Defender.exe oder Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | itp.\n\n/add=ŚCIEŻKA → Dodaj konkretne wykluczenie\n\n- Przykład 1: Defender.exe /add=C:\Program Files\MyProgram\n- Przykład 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Usuń wszystkie wykluczenia\n\n/remove=ŚCIEŻKA → Usuń konkretne wykluczenie\n\n- Przykład 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Przykład 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksportuj wszystkie wykluczenia\n\n/import → Importuj wszystkie wykluczenia\n\n/help /h /? → Pokaż pomoc\n\nWspiera również:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=ścieżka | -r | -r=ścieżka | -e | -i | -help | -h | -?\n\n- Deweloper: Andy System.