help_title=Hjælp
help_text=Tilgængelige parametre:\n\n/add → Tilføj alle drev til udeladelser\n\n- Eksempel: Defender.exe eller Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | osv.\n\n/add=STI → Tilføj en specifik udeladelse\n\n- Eksempel 1: Defender.exe /add=C:\Program Files\MyProgram\n- Eksempel 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Fjern alle udeladelser\n\n/remove=STI → Fjern en specifik udeladelse\n\n- Eksempel 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Eksempel 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Eksporter alle udeladelser\n\n/import → Importer alle udeladelser\n\n/help /h /? → Vis hjælp\n\nUnderstøtter også:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=sti | -r | -r=sti | -e | -i | -help | -h | -?\n\n- Udvikler: Andy System.