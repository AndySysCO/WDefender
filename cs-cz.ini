help_title=Nápověda
help_text=Dostupné parametry:\n\n/add → Přidat všechny jednotky do vyloučení\n\n- Příklad: Defender.exe nebo Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | atd.\n\n/add=CESTA → Přidat konkrétní vyloučení\n\n- Příklad 1: Defender.exe /add=C:\Program Files\MyProgram\n- Příklad 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Odebrat všechna vyloučení\n\n/remove=CESTA → Odebrat konkrétní vyloučení\n\n- Příklad 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Příklad 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportovat všechna vyloučení\n\n/import → Importovat všechna vyloučení\n\n/help /h /? → Zobrazit nápovědu\n\nTaké podporuje:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=cesta | -r | -r=cesta | -e | -i | -help | -h | -?\n\n- Vývojář: Andy System.