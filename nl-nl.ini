help_title=Hulp
help_text=Beschikbare parameters:\n\n/add → Voeg alle stations toe aan uitsluitingen\n\n- Voorbeeld: Defender.exe of Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | enz.\n\n/add=PAD → Voeg een specifieke uitsluiting toe\n\n- Voorbeeld 1: Defender.exe /add=C:\Program Files\MyProgram\n- Voorbeeld 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Verwijder alle uitsluitingen\n\n/remove=PAD → Verwijder een specifieke uitsluiting\n\n- Voorbeeld 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Voorbeeld 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exporteer alle uitsluitingen\n\n/import → Importeer alle uitsluitingen\n\n/help /h /? → Hulp weergeven\n\nOndersteunt juga:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=pad | -r | -r=pad | -e | -i | -help | -h | -?\n\n- Ontwikkelaar: Andy System.