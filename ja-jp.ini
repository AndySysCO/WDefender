help_title=ヘルプ
help_text=利用可能なパラメータ:\n\n/add → すべてのドライブを除外リストに追加\n\n- 例: Defender.exe または Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | など\n\n/add=パス → 特定の除外を追加\n\n- 例 1: Defender.exe /add=C:\Program Files\MyProgram\n- 例 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → すべての除外を削除\n\n/remove=パス → 特定の除外を削除\n\n- 例 1: Defender.exe /remove=C:\Program Files\MyProgram\n- 例 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → すべての除外をエクスポート\n\n/import → すべての除外をインポート\n\n/help /h /? → ヘルプを表示\n\n以下もサポート:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=パス | -r | -r=パス | -e | -i | -help | -h | -?\n\n- 開発者: Andy System.