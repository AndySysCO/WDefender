help_title=도움말
help_text=사용 가능한 매개변수:\n\n/add → 모든 드라이브를 제외 항목에 추가\n\n- 예: Defender.exe 또는 Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | 등\n\n/add=경로 → 특정 제외 항목 추가\n\n- 예 1: Defender.exe /add=C:\Program Files\MyProgram\n- 예 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → 모든 제외 항목 제거\n\n/remove=경로 → 특정 제외 항목 제거\n\n- 예 1: Defender.exe /remove=C:\Program Files\MyProgram\n- 예 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → 모든 제외 항목 내보내기\n\n/import → 모든 제외 항목 가져오기\n\n/help /h /? → 도움말 표시\n\n다음도 지원:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=경로 | -r | -r=경로 | -e | -i | -help | -h | -?\n\n- 개발자: Andy System.