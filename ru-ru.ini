help_title=Помощь
help_text=Доступные параметры:\n\n/add → Добавить все диски в исключения\n\n- Пример: Defender.exe или Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | и т. д.\n\n/add=ПУТЬ → Добавить конкретное исключение\n\n- Пример 1: Defender.exe /add=C:\Program Files\МояПрограмма\n- Пример 2: Defender.exe /add=%ProgramFiles%\МояПрограмма\n\n/remove → Удалить все исключения\n\n/remove=ПУТЬ → Удалить конкретное исключение\n\n- Пример 1: Defender.exe /remove=C:\Program Files\МояПрограмма\n- Пример 2: Defender.exe /remove=%ProgramFiles%\МояПрограмма\n\n/export → Экспортировать все исключения\n\n/import → Импортировать все исключения\n\n/help /h /? → Показать справку\n\nТакже поддерживает:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=путь | -r | -r=путь | -e | -i | -help | -h | -?\n\n- Разработчик: Andy System.
