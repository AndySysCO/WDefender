help_title=帮助
help_text=可用参数：\n\n/add → 将所有驱动器添加到排除项\n\n- 示例：Defender.exe 或 Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | 等\n\n/add=路径 → 添加特定排除项\n\n- 示例 1：Defender.exe /add=C:\Program Files\MyProgram\n- 示例 2：Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → 删除所有排除项\n\n/remove=路径 → 删除特定排除项\n\n- 示例 1：Defender.exe /remove=C:\Program Files\MyProgram\n- 示例 2：Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → 导出所有排除项\n\n/import → 导入所有排除项\n\n/help /h /? → 显示帮助\n\n还支持：\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=路径 | -r | -r=路径 | -e | -i | -help | -h | -?\n\n- 开发者：Andy System.