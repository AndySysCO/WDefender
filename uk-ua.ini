help_title=Довідка
help_text=Доступні параметри:\n\n/add → Додати всі диски до виключень\n\n- Приклад: Defender.exe або Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | тощо.\n\n/add=ШЛЯХ → Додати конкретне виключення\n\n- Приклад 1: Defender.exe /add=C:\Program Files\МояПрограма\n- Приклад 2: Defender.exe /add=%ProgramFiles%\МояПрограма\n\n/remove → Видалити всі виключення\n\n/remove=ШЛЯХ → Видалити конкретне виключення\n\n- Приклад 1: Defender.exe /remove=C:\Program Files\МояПрограма\n- Приклад 2: Defender.exe /remove=%ProgramFiles%\МояПрограма\n\n/export → Експортувати всі виключення\n\n/import → Імпортувати всі виключення\n\n/help /h /? → Показати довідку\n\nТакож підтримує:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=шлях | -r | -r=шлях | -e | -i | -help | -h | -?\n\n- Розробник: Andy System.