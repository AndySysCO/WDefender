help_title=Pomoč
help_text=Razpoložljivi parametri:\n\n/add → Dodaj vse pogone med izključitve\n\n- Primer: Defender.exe ali Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | itd.\n\n/add=POT → Dodaj specifično izključitev\n\n- Primer 1: Defender.exe /add=C:\Program Files\MyProgram\n- Primer 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Odstrani vse izključitve\n\n/remove=POT → Odstrani specifično izključitev\n\n- Primer 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Primer 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Izvozi vse izključitve\n\n/import → Uvozi vse izključitve\n\n/help /h /? → Prikaži pomoč\n\nPodpira tudi:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=pot | -r | -r=pot | -e | -i | -help | -h | -?\n\n- Razvijalec: Andy System.