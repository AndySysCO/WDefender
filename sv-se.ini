help_title=Hjälp
help_text=Tillgängliga parametrar:\n\n/add → Lägg till alla enheter i undantag\n\n- Exempel: Defender.exe eller Defender.lnk /add → C:\ | D:\ | E:\ | J:\ | osv.\n\n/add=SÖKVÄG → Lägg till ett specifikt undantag\n\n- Exempel 1: Defender.exe /add=C:\Program Files\MyProgram\n- Exempel 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove → Ta bort alla undantag\n\n/remove=SÖKVÄG → Ta bort ett specifikt undantag\n\n- Exempel 1: Defender.exe /remove=C:\Program Files\MyProgram\n- Exempel 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export → Exportera alla undantag\n\n/import → Importera alla undantag\n\n/help /h /? → Visa hjälp\n\nStöder även:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=sökväg | -r | -r=sökväg | -e | -i | -help | -h | -?\n\n- Utvecklare: Andy System.