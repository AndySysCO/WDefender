help_title=עזרה
help_text=פרמטרים זמינים:\n\n/add ← הוסף את כל הכוננים להחרגות\n\n- דוגמה: Defender.exe או Defender.lnk /add ← C:\ | D:\ | E:\ | J:\ | וכו'.\n\n/add=PATH ← הוסף החרגה ספציפית\n\n- דוגמה 1: Defender.exe /add=C:\Program Files\MyProgram\n- דוגמה 2: Defender.exe /add=%ProgramFiles%\MyProgram\n\n/remove ← הסר את כל ההחרגות\n\n/remove=PATH ← הסר החרגה ספציפית\n\n- דוגמה 1: Defender.exe /remove=C:\Program Files\MyProgram\n- דוגמה 2: Defender.exe /remove=%ProgramFiles%\MyProgram\n\n/export ← ייצא את כל ההחרגות\n\n/import ← ייבא את כל ההחרגות\n\n/help /h /? ← הצג עזרה\n\nתומך גם ב:\n\n-add | -add= | -remove | -remove= | -export | -import | -a | -a=path | -r | -r=path | -e | -i | -help | -h | -?\n\n- מפתח: Andy System.